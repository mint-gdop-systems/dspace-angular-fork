<div class="container py-4">
    <h2 class="mb-4">Potential Duplicates</h2>

    <!-- Loading Spinner -->
    <div *ngIf="loading$ | async" class="text-center py-5">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p class="mt-2 text-muted">Loading potential duplicates...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!(loading$ | async) && groups.length === 0" class="alert alert-info" role="alert">
        No potential duplicates found.
    </div>

    <!-- Duplicate Groups List -->
    <ng-container *ngIf="!(loading$ | async)">
        <div class="card mb-3 shadow-sm" *ngFor="let group of groups">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong class="text-break">{{ group.signature }}</strong>
                <span class="badge bg-secondary ms-2">{{ group.items?.length || 0 }} items</span>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center" *ngFor="let item of group.items">
                    <i class="fas fa-file-alt text-secondary me-2"></i>
                    <a [routerLink]="handleRoute(item.handle)" class="text-decoration-none">
                        {{ item.handle }}
                    </a>
                </li>
            </ul>
        </div>
    </ng-container>
</div>
