<ng-container *ngVar="(groupedBitstreams$ | async) as groups">
  @if (groups?.length > 0) {
  <ds-metadata-field-wrapper>
    <div class="file-section">
      @if (allFiles.length > 0) {
      <div class="mb-4 file-preview-section">
        <ds-file-preview-panel [fileList]="allFiles" [selectedFile]="selectedFile"
          (fileSelected)="onFileSelected($event)">
        </ds-file-preview-panel>
      </div>
      }
    </div>
  </ds-metadata-field-wrapper>
  }
</ng-container>
